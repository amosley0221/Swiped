<?xml version="1.0" encoding="UTF-8"?>
<!-- Maskable icon: content stays inside the central 80% safe zone so
     Android's adaptive icon mask (circle / squircle / etc.) can crop the
     edges without removing the artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0B0B0E"/>
  <circle cx="256" cy="256" r="130" fill="#FAFAF7"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#4FA862" stroke-width="8"/>
</svg>
