<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#FAFAF7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Swiped" />
  <link rel="manifest" href="manifest.json" />
  <title>Swiped</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <style>
    :root { color-scheme: light; }
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      /* Match the stage background so the status-bar safe area and any
         unused viewport space (e.g. an unfolded Fold) blend with the app
         instead of letterboxing in black. */
      background: #FAFAF7;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    }
    #root { width: 100%; height: 100%; }
    /* Detail view reveal — runs once after the wheel commit animation
       leaves the dial off-screen, so the page fades + scales gently into
       its full position rather than appearing instantly. */
    @keyframes swipedDetailReveal {
      from { opacity: 0; transform: translate3d(0, 18px, 0) scale(0.99); }
      to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Supabase JS SDK — provides window.supabase.createClient for sync.js. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- sync.js auto-initializes Supabase, attaches auth listeners, and
       bridges the swiped-state-set / swiped-state-external pub/sub to a
       per-user row in the user_data table. -->
  <script src="sync.js?v=20260513i"></script>
  <!-- ICS calendar import — fetches Outlook (or any RFC-5545 ICS feed)
       through a CORS proxy and expands recurrence into per-week
       occurrences. window.SwipedICS.getEvents(url, start, end).
       Renamed from ics.js → ics-v2.js to bypass iOS PWAs that were
       holding onto a cached older copy of the script. -->
  <script src="ics-v2.js?v=20260513i"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="wheel-v2.jsx?v=20260513i"></script>
  <script type="text/babel" src="liquid.jsx?v=20260513i"></script>
  <script type="text/babel" src="detail.jsx?v=20260513i"></script>
  <script type="text/babel" src="settings.jsx?v=20260513i"></script>
  <script type="text/babel" src="app.jsx?v=20260513i"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <script>
    // Register the service worker so Android Chrome treats Swiped as an
    // installable PWA (otherwise the "install" option in the menu falls
    // back to "Add shortcut" / Chrome-hosted site instead of standalone).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => { /* ignore */ });
      });
    }
  </script>
</body>
</html>
